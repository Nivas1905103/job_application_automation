# Triggering GitHub Actions cloud run with saved repository secrets
name: Daily Midnight Job Application Automation

on:
  schedule:
    # 12:00 AM IST corresponds to 18:30 UTC
    - cron: '30 18 * * *'
  push:
    branches: [main]
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions UI

jobs:
  auto-apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install chromium

      - name: Run Daily Job Search & Auto-Apply
        env:
          CANDIDATE_EMAIL: ${{ secrets.CANDIDATE_EMAIL || 'nivasanmugam@gmail.com' }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: 587
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: |
          python daily_cron_job.py

      - name: Commit & Push Updated History Logs
        run: |
          git config --global user.name "AutoApply Cloud Bot"
          git config --global user.email "bot@autoapply.ai"
          git add applications_history.json reports/
          git commit -m "Auto-apply run log: $(date -u)" || echo "No log changes to commit"
          git push || echo "No remote repository configured yet"
